
server:
  port: 1290
# Spring 配置用于邮件和 RabbitMQ
spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # 数据源配置，用于连接 POSTGRESQL 数据库
  datasource:
#    数据库连接 URL 后面加上 stringtype=unspecified。这会让 PG 驱动尝试自动转换类型
    url: jdbc:postgresql://localhost:5432/geolabel?stringtype=unspecified  # POSTGRESQL 数据库的 JDBC URL
    username: postgres  # 数据库用户名
    password: 822558  # 数据库密码
    driver-class-name: org.postgresql.Driver  # POSTGRESQL JDBC 驱动类名
    # Spring Security 配置，用于 JWT 身份验证
  security:
    jwt:
      key: '321456'  # JWT 密钥
      expire: 72  # JWT 过期时间（小时）
  #      limit:
  #        base: 10  # 基础频率限制
  #        upgrade: 300  # 升级频率限制
  #        frequency: 30  # 频率限制

  redis:
    host: localhost   # Redis服务器主机名
    port: 6379        # Redis服务器端口
    password:       # Redis服务器密码（如果有的话）
    database: 0       # Redis数据库索引，默认是0


  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB

geoserver:
  url: http://localhost:8080/geoserver
  username: admin
  password: geoserver
  localCoverageDir: D:/PG-project/mapDataStore

minio:
  endpoint: http://127.0.0.1:9005 #Minio服务所在地址
  bucketName: geoserver #存储桶名称
  accessKey: admin #访问的key
  secretKey: 12345678 #访问的秘钥
  uploaddir: D:\\program\\MINIO\\data\\geoserver

knife4j:
  enable: true

logging:
  level:
    com.example.labelMark.mapper: trace
  #    org:
  #      springframework:
  #        security: DEBUG
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

modal:
  path: D:\PG-project\modalDataStore

sampleSet:
  path: D:\PG-project\sampleSetDataStore

python:
  service:
    url: ${PYTHON_SERVICE_URL:http://localhost:5000}
